<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SlideX 放映</title>
<link rel="stylesheet" href="/runtime.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<style>
html, body { margin: 0; height: 100%; background: #101419; overflow: hidden; font-family: 'Segoe UI', 'MiSans', sans-serif; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide-holder { position: absolute; transform-origin: center center; box-shadow: 0 10px 60px #000C; }
#hud { position: fixed; right: 16px; bottom: 12px; color: #93A2B2; font-size: 13px; z-index: 9; user-select: none; }
#hint { position: fixed; left: 16px; bottom: 12px; color: #5A6673; font-size: 12px; z-index: 9; user-select: none; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; background: #E7EDF2; color: #22303A; padding: 10px 18px; font-size: 15px; line-height: 1.6; max-height: 22vh; overflow: auto; display: none; z-index: 8; border-top: 2px solid #14606C; }
#clickzone { position: fixed; inset: 0; z-index: 5; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="clickzone"></div>
<div id="notes"></div>
<div id="hud">1 / ?</div>
<div id="hint"></div>
<script src="/runtime.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onerror="window.__katex_failed=1" onload="try{window.slxRenderMath(document)}catch(e){}"></script>
<script type="module" src="/app/dist/present.js"></script>
</body>
</html>
