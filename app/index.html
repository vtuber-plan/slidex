<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideX Editor</title>
<script>
/* 主题预解析：在任何 CSS 绘制前确定 data-theme，避免刷新闪色 */
(function () {
  var t = 'auto';
  try { t = localStorage.getItem('slidex-theme') || 'auto'; } catch (e) {}
  var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="stylesheet" href="/app/theme.css">
<link rel="stylesheet" href="/runtime.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>

<!-- 标题栏：logo + 文件名 | 语言 / 主题 -->
<header id="titlebar">
  <div class="tb-left">
    <span id="logo"><i class="fa-solid fa-clapperboard"></i>&nbsp;Slide<b>X</b></span>
    <span id="deckName" class="muted" title="">—</span>
  </div>
  <div class="tb-right">
    <select id="langSel" title="Language">
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
    <select id="themeSel" data-i18n-title="app.themeTitle">
      <option value="auto" data-i18n="app.themeAuto">跟随系统</option>
      <option value="light" data-i18n="app.themeLight">亮色</option>
      <option value="dark" data-i18n="app.themeDark">暗色</option>
    </select>
  </div>
</header>

<!-- Ribbon：选项卡 + 分组工具页 -->
<div id="ribbon">
  <div class="tabstrip" role="tablist">
    <button class="rtab active" data-tab="home" data-i18n="tab.home">开始</button>
    <button class="rtab" data-tab="insert" data-i18n="tab.insert">插入</button>
    <button class="rtab" data-tab="design" data-i18n="tab.design">设计</button>
    <button class="rtab" data-tab="view" data-i18n="tab.view">视图</button>
  </div>

  <!-- 开始：幻灯片 / 剪贴板 / 排列 / 放映 -->
  <div class="ribbon-page active" data-page="home">
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" id="btnNewSlide" data-i18n-title="app.newSlideTitle"><i class="fa-solid fa-square-plus"></i><span data-i18n="rb.newSlide">新建页</span></button>
        <button class="rbtn" id="btnDupSlide"><i class="fa-solid fa-clone"></i><span data-i18n="rb.dupSlide">复制页</span></button>
        <button class="rbtn" id="btnDelSlide"><i class="fa-solid fa-trash-can"></i><span data-i18n="rb.delSlide">删页</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.slides">幻灯片</div>
    </div>
    <div class="rsep"></div>
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" id="btnUndo" data-i18n-title="app.undoTitle"><i class="fa-solid fa-rotate-left"></i><span data-i18n="rb.undo">撤销</span></button>
        <button class="rbtn" id="btnRedo" data-i18n-title="app.redoTitle"><i class="fa-solid fa-rotate-right"></i><span data-i18n="rb.redo">重做</span></button>
        <button class="rbtn" id="btnPainter" data-i18n-title="app.painterTitle"><i class="fa-solid fa-paint-roller"></i><span data-i18n="rb.painter">格式刷</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.clipboard">剪贴板</div>
    </div>
    <div class="rsep"></div>
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn slim align-btn" data-align="left" data-i18n-title="app.alignLeft"><i class="fa-solid fa-align-left"></i></button>
        <button class="rbtn slim align-btn" data-align="center" data-i18n-title="app.alignCenterH"><i class="fa-solid fa-align-center"></i></button>
        <button class="rbtn slim align-btn" data-align="right" data-i18n-title="app.alignRight"><i class="fa-solid fa-align-right"></i></button>
        <button class="rbtn slim align-btn" data-align="top" data-i18n-title="app.alignTop"><i class="fa-solid fa-arrow-up-long"></i></button>
        <button class="rbtn slim align-btn" data-align="middle" data-i18n-title="app.alignCenterV"><i class="fa-solid fa-grip-lines"></i></button>
        <button class="rbtn slim align-btn" data-align="bottom" data-i18n-title="app.alignBottom"><i class="fa-solid fa-arrow-down-long"></i></button>
        <button class="rbtn slim" id="btnFront" data-i18n-title="app.front"><i class="fa-solid fa-angles-up"></i></button>
        <button class="rbtn slim" id="btnBack" data-i18n-title="app.back"><i class="fa-solid fa-angles-down"></i></button>
      </div>
      <div class="rlabel" data-i18n="rg.arrange">排列</div>
    </div>
    <div class="rsep"></div>
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn accent" id="btnPresent"><i class="fa-solid fa-play"></i><span data-i18n="rb.present">放映</span></button>
        <button class="rbtn" id="btnSave"><i class="fa-solid fa-floppy-disk"></i><span data-i18n="rb.save">保存</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.show">放映</div>
    </div>
  </div>

  <!-- 插入：文本媒体 / 形状线条（保留隐藏的 insertType 供逻辑兼容） -->
  <div class="ribbon-page" data-page="insert">
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" data-insert="text"><i class="fa-solid fa-font"></i><span data-i18n="el.text">文本</span></button>
        <button class="rbtn" data-insert="image"><i class="fa-solid fa-image"></i><span data-i18n="el.image">图片</span></button>
        <button class="rbtn" data-insert="icon"><i class="fa-solid fa-icons"></i><span data-i18n="el.icon">图标</span></button>
        <button class="rbtn" data-insert="table"><i class="fa-solid fa-table"></i><span data-i18n="el.table">表格</span></button>
        <button class="rbtn" data-insert="chart"><i class="fa-solid fa-chart-column"></i><span data-i18n="el.chart">图表</span></button>
        <button class="rbtn" data-insert="code"><i class="fa-solid fa-terminal"></i><span data-i18n="el.code">代码</span></button>
        <button class="rbtn" data-insert="formula"><i class="fa-solid fa-square-root-variable"></i><span data-i18n="el.formula">公式</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.elements">元素</div>
    </div>
    <div class="rsep"></div>
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" data-insert="line"><i class="fa-solid fa-slash"></i><span data-i18n="el.line">线条</span></button>
        <button class="rbtn" data-insert="shape:rect"><i class="fa-solid fa-square"></i><span data-i18n="el.rect">矩形</span></button>
        <button class="rbtn" data-insert="shape:roundRect"><i class="fa-regular fa-square"></i><span data-i18n="el.roundRect">圆角矩形</span></button>
        <button class="rbtn" data-insert="shape:ellipse"><i class="fa-regular fa-circle"></i><span data-i18n="el.ellipse">椭圆</span></button>
        <button class="rbtn" data-insert="shape:rightArrow"><i class="fa-solid fa-arrow-right-long"></i><span data-i18n="el.rightArrow">箭头</span></button>
        <button class="rbtn" data-insert="shape:star5"><i class="fa-regular fa-star"></i><span data-i18n="el.star5">五角星</span></button>
        <button class="rbtn" data-insert="shape:donut"><i class="fa-solid fa-circle-notch"></i><span data-i18n="el.donut">圆环</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.shapes">形状</div>
    </div>
    <select id="insertType" class="visually-hidden" aria-hidden="true" tabindex="-1">
      <option value=""></option>
    </select>
  </div>

  <!-- 设计：导出 -->
  <div class="ribbon-page" data-page="design">
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" data-exp="png"><i class="fa-solid fa-file-image"></i><span>PNG</span></button>
        <button class="rbtn" data-exp="pdf"><i class="fa-solid fa-file-pdf"></i><span>PDF</span></button>
        <button class="rbtn" data-exp="pptx"><i class="fa-solid fa-file-powerpoint"></i><span data-i18n="rb.pptx">PPTX</span></button>
        <button class="rbtn" data-exp="pptx-editable"><i class="fa-solid fa-file-zipper"></i><span data-i18n="rb.pptxEditable">PPTX 可编辑</span></button>
        <button class="rbtn" data-exp="html"><i class="fa-solid fa-file-code"></i><span>HTML</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.export">导出</div>
    </div>
    <div class="rsep"></div>
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" id="btnSource"><i class="fa-solid fa-code"></i><span data-i18n="rb.source">源码</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.code">源码视图</div>
    </div>
    <select id="exportFormat" class="visually-hidden" aria-hidden="true" tabindex="-1">
      <option value=""></option>
    </select>
  </div>

  <!-- 视图：缩放 -->
  <div class="ribbon-page" data-page="view">
    <div class="rgroup">
      <div class="rbtns">
        <button class="rbtn" id="zoomFit"><i class="fa-solid fa-arrows-left-right-to-line"></i><span data-i18n="sb.fit">适配</span></button>
        <button class="rbtn" id="zoom100"><i class="fa-solid fa-magnifying-glass"></i><span>100%</span></button>
      </div>
      <div class="rlabel" data-i18n="rg.zoom">缩放</div>
    </div>
  </div>
</div>

<div id="main">
  <aside id="slidesPane">
    <div id="thumbs"></div>
  </aside>
  <div id="canvasArea">
    <div id="canvasScroll">
      <div id="canvasWrap">
        <div id="canvasHost"></div>
        <div id="overlay"></div>
        <div id="editBar" class="hidden">
          <button data-cmd="bold" data-i18n-title="eb.bold"><b>B</b></button>
          <button data-cmd="italic" data-i18n-title="eb.italic"><i>I</i></button>
          <button data-cmd="underline" data-i18n-title="eb.underline"><u>U</u></button>
          <button data-cmd="strikeThrough" data-i18n-title="eb.strike"><s>S</s></button>
          <span class="eb-sep"></span>
          <input type="number" id="editFontSize" min="8" max="300" placeholder="px" data-i18n-title="eb.fontSize">
          <input type="color" id="editColor" value="#232A31" data-i18n-title="eb.color">
          <span class="eb-sep"></span>
          <button data-cmd="justifyLeft" data-i18n-title="eb.justifyLeft">⇤</button>
          <button data-cmd="justifyCenter" data-i18n-title="eb.justifyCenter">↔</button>
          <button data-cmd="justifyRight" data-i18n-title="eb.justifyRight">⇥</button>
          <span class="eb-sep"></span>
          <button data-cmd="removeFormat" data-i18n-title="eb.removeFormat">⌫</button>
          <button id="editDone" class="primary" data-i18n-title="eb.done">✓</button>
        </div>
      </div>
    </div>
  </div>
  <aside id="inspector">
    <div id="inspectorBody">
      <div class="insp-empty">…</div>
    </div>
  </aside>
</div>

<!-- 状态栏：页码 · 诊断 | 适配 缩放滑杆 百分比 -->
<footer id="statusbar">
  <div id="statusLeft">
    <span id="slidePos"></span>
    <span id="diag" data-i18n="sb.ready">就绪</span>
  </div>
  <div id="statusRight">
    <button id="zoomOut" title="−"><i class="fa-solid fa-minus"></i></button>
    <input type="range" id="zoomSlider" min="10" max="300" value="100" step="1">
    <button id="zoomIn" title="＋"><i class="fa-solid fa-plus"></i></button>
    <span id="zoomLabel">100%</span>
    <button id="zoomFitBtn" data-i18n="sb.fit">适配</button>
  </div>
</footer>

<div id="sourceModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <b data-i18n="src.title">deck.slx 源码</b>
      <span class="muted small" data-i18n="src.hint">编辑后点「应用」——有语法错误不会应用</span>
      <div>
        <button id="srcFormat" data-i18n="src.format">整理格式</button>
        <button id="srcApply" class="primary" data-i18n="src.apply">应用</button>
        <button id="srcClose" data-i18n="src.close">关闭</button>
      </div>
    </div>
    <div id="srcError" class="src-error hidden"></div>
    <textarea id="sourceText" spellcheck="false"></textarea>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
window.__slxErrors = [];
window.addEventListener('error', e => window.__slxErrors.push('ERROR ' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => window.__slxErrors.push('REJECT ' + String(e.reason && e.reason.stack || e.reason).slice(0, 300)));
</script>
<script src="/runtime.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onerror="window.__katex_failed=1" onload="try{window.slxRenderMath(document)}catch(e){}"></script>
<script type="module" src="/app/dist/editor.js"></script>
</body>
</html>
