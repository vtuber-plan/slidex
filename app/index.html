<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideX Editor</title>
<link rel="stylesheet" href="/runtime.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<header id="toolbar">
  <div class="tb-group">
    <span id="logo">Slide<b>X</b></span>
    <span id="deckName" class="muted" title="">—</span>
  </div>
  <div class="tb-group">
    <button id="btnNewSlide" data-i18n="app.newSlide" data-i18n-title="app.newSlideTitle">＋页</button>
    <button id="btnDupSlide" data-i18n="app.dupSlide">复制页</button>
    <button id="btnDelSlide" data-i18n="app.delSlide">删页</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btnUndo" data-i18n-title="app.undoTitle">↩</button>
    <button id="btnRedo" data-i18n-title="app.redoTitle">↪</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label" data-i18n="app.insert">插入</span>
    <select id="insertType">
      <option value="" data-i18n="app.insertPick">选择元素…</option>
      <option value="text">text</option>
      <option value="shape:rect">rect</option>
      <option value="shape:roundRect">roundRect</option>
      <option value="shape:ellipse">ellipse</option>
      <option value="shape:rightArrow">rightArrow</option>
      <option value="shape:star5">star5</option>
      <option value="shape:donut">donut</option>
      <option value="line">line</option>
      <option value="image">image</option>
      <option value="icon">icon</option>
      <option value="table">table</option>
      <option value="chart">chart</option>
      <option value="code">code</option>
      <option value="formula">formula</option>
    </select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="align-btn" data-align="left" data-i18n-title="app.alignLeft">⇤</button>
    <button class="align-btn" data-align="center" data-i18n-title="app.alignCenterH">↔</button>
    <button class="align-btn" data-align="right" data-i18n-title="app.alignRight">⇥</button>
    <button class="align-btn" data-align="top" data-i18n-title="app.alignTop">⇧</button>
    <button class="align-btn" data-align="middle" data-i18n-title="app.alignCenterV">↕</button>
    <button class="align-btn" data-align="bottom" data-i18n-title="app.alignBottom">⇩</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btnFront" data-i18n-title="app.front">⬆</button>
    <button id="btnBack" data-i18n-title="app.back">⬇</button>
    <button id="btnPainter" data-i18n-title="app.painterTitle">🖌</button>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-group">
    <button id="btnSource" data-i18n="app.source">源码</button>
    <button id="btnPresent" data-i18n="app.present">放映</button>
    <button id="btnSave" class="primary" data-i18n="app.save">保存</button>
    <select id="exportFormat">
      <option value="" data-i18n="app.export">导出…</option>
      <option value="png" data-i18n="app.export.png">PNG（每页 2x）</option>
      <option value="pdf" data-i18n="app.export.pdf">PDF（矢量文本）</option>
      <option value="pptx" data-i18n="app.export.pptx">PPTX（一比一）</option>
      <option value="pptx-editable" data-i18n="app.export.pptxEditable">PPTX（可编辑混合）</option>
      <option value="html" data-i18n="app.export.html">HTML（自包含）</option>
    </select>
    <select id="langSel" title="Language">
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<div id="main">
  <aside id="slidesPane">
    <div id="thumbs"></div>
  </aside>
  <div id="canvasArea">
    <div id="canvasScroll">
      <div id="canvasWrap">
        <div id="canvasHost"></div>
        <div id="overlay"></div>
        <div id="editBar" class="hidden">
          <button data-cmd="bold" data-i18n-title="eb.bold"><b>B</b></button>
          <button data-cmd="italic" data-i18n-title="eb.italic"><i>I</i></button>
          <button data-cmd="underline" data-i18n-title="eb.underline"><u>U</u></button>
          <button data-cmd="strikeThrough" data-i18n-title="eb.strike"><s>S</s></button>
          <span class="eb-sep"></span>
          <input type="number" id="editFontSize" min="8" max="300" placeholder="px" data-i18n-title="eb.fontSize">
          <input type="color" id="editColor" value="#232A31" data-i18n-title="eb.color">
          <span class="eb-sep"></span>
          <button data-cmd="justifyLeft" data-i18n-title="eb.justifyLeft">⇤</button>
          <button data-cmd="justifyCenter" data-i18n-title="eb.justifyCenter">↔</button>
          <button data-cmd="justifyRight" data-i18n-title="eb.justifyRight">⇥</button>
          <span class="eb-sep"></span>
          <button data-cmd="removeFormat" data-i18n-title="eb.removeFormat">⌫</button>
          <button id="editDone" class="primary" data-i18n-title="eb.done">✓</button>
        </div>
      </div>
    </div>
  </div>
  <aside id="inspector">
    <div id="inspectorBody">
      <div class="insp-empty">…</div>
    </div>
  </aside>
</div>

<footer id="statusbar">
  <div id="diag" data-i18n="sb.ready">就绪</div>
  <div id="statusRight">
    <button id="zoomOut">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn">＋</button>
    <button id="zoomFit" data-i18n="sb.fit">适配</button>
  </div>
</footer>

<div id="sourceModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <b data-i18n="src.title">deck.slx 源码</b>
      <span class="muted small" data-i18n="src.hint">编辑后点「应用」——有语法错误不会应用</span>
      <div>
        <button id="srcFormat" data-i18n="src.format">整理格式</button>
        <button id="srcApply" class="primary" data-i18n="src.apply">应用</button>
        <button id="srcClose" data-i18n="src.close">关闭</button>
      </div>
    </div>
    <div id="srcError" class="src-error hidden"></div>
    <textarea id="sourceText" spellcheck="false"></textarea>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
window.__slxErrors = [];
window.addEventListener('error', e => window.__slxErrors.push('ERROR ' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => window.__slxErrors.push('REJECT ' + String(e.reason && e.reason.stack || e.reason).slice(0, 300)));
</script>
<script src="/runtime.js"></script>
<script type="module" src="/app/dist/editor.js"></script>
</body>
</html>
