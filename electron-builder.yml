# electron-builder.yml — SlideX 桌面分发配置
# 目标：win x64/arm64（NSIS 安装版 + 便携版）、macOS arm64（dmg + zip 便携）、
#       linux x64（AppImage 便携 + deb 安装）
appId: io.github.slidex.app
productName: SlideX
directories:
  output: release/${version}
  buildResources: build
asar: true
compression: maximum
files:
  - dist/**/*
  - dist-electron/**/*
  - app/**/*
  - "!app/ts/**"
  - "!app/types/**"
  - package.json
  - skills/**/*
  - docs/**/*
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: nsis
      arch: [arm64]
    - target: portable
      arch: [x64]
    - target: portable
      arch: [arm64]
nsis:
  buildUniversalInstaller: false
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  installerLanguages: [zh_CN, en_US]
  language: '2052'
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  shortcutName: SlideX
  createDesktopShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
linux:
  icon: build/icon.png
  category: Office
  maintainer: SlideX Team
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
