name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - name: Build + Test
        run: |
          npm run build
          node test/run.mjs
      - run: npm run test:electron
      - run: npm run dist:tools
      - run: npm run test:tools -- --render
      - uses: actions/upload-artifact@v7
        with:
          name: slidex-tools
          path: |
            release/**/*.tgz
            release/**/slidex-skill-*.zip
            release/**/tools-SHA256SUMS.txt
          if-no-files-found: error

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows x64 + arm64：NSIS 安装版 + 便携版（可交叉出 arm64）
          - os: windows-latest
            args: --win nsis portable --x64 --arm64
            artifact: slidex-win
          # macOS arm64：dmg 安装版 + zip 便携版（arm64 原生 runner）
          - os: macos-latest
            args: --mac dmg zip --arm64
            artifact: slidex-mac
          # linux x64：AppImage 便携版 + deb 安装包
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
            artifact: slidex-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (src / app / electron)
        run: npm run build
      - name: Verify installed CLI and skill on this platform
        run: |
          npm run dist:tools
          npm run test:tools
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 加速 CI 上的 Electron 二进制下载
          ELECTRON_BUILDER_CACHE: .cache/electron-builder
      - name: Packaged Windows smoke
        if: runner.os == 'Windows'
        run: node test/release-package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release checksums
        run: node scripts/release-manifest.mjs artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  publish-npm:
    if: github.ref_type == 'tag'
    needs: [test, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
      NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify npm destination
        run: |
          node -e "if (!/^@[a-z0-9][a-z0-9._-]*\/slidex$/.test(process.env.NPM_PACKAGE_NAME || '')) throw Error('Set repository variable NPM_PACKAGE_NAME to an owned npm scope, for example @your-scope/slidex')"
          npm run check:release
      - run: npm ci
      - run: npm run build
      - name: Prepare scoped npm package
        run: |
          npm pkg set "name=$NPM_PACKAGE_NAME"
          npm pack --dry-run --ignore-scripts
      - name: Publish CLI and editor to npm
        run: npm publish --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
