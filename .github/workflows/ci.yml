name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    # 测试跑在 windows-latest：GUI/导出测试需要 Chrome，
    # runner 预装 Chrome 位于 C:\Program Files\Google\Chrome\Application\chrome.exe（与 test/* 探测路径一致）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - name: Build (src / app / electron)
        run: npm run build
      - name: Test
        run: node test/run.mjs
      - name: Electron smoke
        run: npm run test:electron
      - name: Package CLI and skill
        run: npm run dist:tools
      - name: Installed CLI and PNG export smoke
        run: npm run test:tools -- --render
      - uses: actions/upload-artifact@v7
        with:
          name: slidex-tools-ci
          path: |
            release/**/*.tgz
            release/**/slidex-skill-*.zip
            release/**/tools-SHA256SUMS.txt
          if-no-files-found: error
  portable-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dist:tools
      - run: npm run test:tools
